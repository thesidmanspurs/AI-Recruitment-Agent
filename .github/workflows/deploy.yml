name: Multi-Environment CI/CD Pipeline — UAT & Production

on:
  push:
    branches:
      - main
      - uat
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # ── Phase 1: Code Quality & TypeScript Check ─────────────────────────────
  check:
    name: 🧪 Code Quality & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 🔍 TypeScript Check — Frontend
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

      - name: 🔍 TypeScript Check — Backend
        run: |
          cd backend
          npm ci
          npx tsc --noEmit

  # ── Phase 2: Deploy to GCP (UAT vs Production) ─────────────────────────────
  deploy:
    name: 🚀 Deploy Environment
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to GCP (Keyless Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/450422168558/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@ai-recruitment-agent-496914.iam.gserviceaccount.com'

      - name: 🛠️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: 'ai-recruitment-agent-496914'

      - name: 🌐 Determine Target Service (UAT vs Production)
        id: target
        run: |
          # If branch is main or manual input is production -> Production Service
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ inputs.target_env }}" = "production" ]; then
            echo "service=ai-recruitment-agent" >> $GITHUB_OUTPUT
            echo "env_name=Production" >> $GITHUB_OUTPUT
          else
            echo "service=ai-recruitment-agent-uat" >> $GITHUB_OUTPUT
            echo "env_name=UAT" >> $GITHUB_OUTPUT
          fi

      - name: 🚢 Submit Cloud Build & Deploy
        run: |
          echo "Deploying to Service: ${{ steps.target.outputs.service }} (${{ steps.target.outputs.env_name }})"
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --project=ai-recruitment-agent-496914 \
            --substitutions=_SERVICE="${{ steps.target.outputs.service }}",_CLOUDSQL_CONN="ai-recruitment-agent-496914:us-central1:agent-db",_IMAGE_TAG="${GITHUB_SHA::7}"
