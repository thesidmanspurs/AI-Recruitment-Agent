name: CI/CD Pipeline — Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Phase 1: Lint & Code Checks ──────────────────────────────────────────
  check:
    name: 🧪 Code Quality & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 🔍 TypeScript Check — Frontend
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

      - name: 🔍 TypeScript Check — Backend
        run: |
          cd backend
          npm ci
          npx tsc --noEmit

  # ── Phase 2: Deploy to GCP Cloud Run ──────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GCP Cloud Run
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🛠️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID || 'ai-recruitment-agent-496914' }}

      - name: 🚢 Submit Cloud Build & Deploy to Cloud Run
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --project=${{ secrets.GCP_PROJECT_ID || 'ai-recruitment-agent-496914' }} \
            --substitutions=_CLOUDSQL_CONN="${{ secrets.GCP_CLOUDSQL_CONN || 'ai-recruitment-agent-496914:us-central1:agent-db' }}",_IMAGE_TAG="${GITHUB_SHA::7}"
